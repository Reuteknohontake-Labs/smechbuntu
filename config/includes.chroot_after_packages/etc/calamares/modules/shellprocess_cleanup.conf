---
# Runs in the target chroot right after unpackfs: strip live-session-only files.
dontChroot: false
timeout: 60
script:
  - "rm -f /etc/sddm.conf.d/10-smechlinux-live-autologin.conf /etc/sudoers.d/90-smechlinux-live"
  - "rm -f /usr/share/applications/smechlinux-install.desktop /etc/skel/Desktop/smechlinux-install.desktop"
