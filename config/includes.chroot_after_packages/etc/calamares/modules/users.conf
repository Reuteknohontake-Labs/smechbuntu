---
defaultGroups: [ adm, cdrom, sudo, plugdev, audio, video, netdev ]
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
passwordRequirements:
  minLength: 1
  maxLength: -1
user:
  shell: /bin/bash
  forbidden_names: [ root, smech ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "smechlinux-${first}"
  forbidden_names: [ localhost ]
presets:
  loginName:
    value: ""
    editable: true
  fullName:
    value: ""
    editable: true
allowWeakPasswords: true
allowWeakPasswordsDefault: false
